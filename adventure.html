<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure - Defenders of the Data</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/td.css">
  <link rel="stylesheet" href="css/adventure.css">
</head>
<body class="adventure">
  <header class="hud">
    <h1 class="sr-only">Internet Adventure</h1>
    <div class="hud-left">
      <a class="btn btn-small" href="index.html" aria-label="Back to main menu">&#8592; Menu</a>
      <a class="hud-coder" id="hud-coder" href="index.html#coder" title="Your coder. Spend your stars on new looks in the Coder Locker" aria-label="Your coder: open the Coder Locker"></a>
    </div>
    <div class="stats">
      <span class="stat zone-name" id="zone-name"></span>
      <span class="stat hp-stat" title="Your data. If it runs out, you go back to the last Restore Point.">❤️ Data
        <span class="hp-bar"><span id="hud-hp-fill"></span></span>
        <strong id="hud-hp"></strong>
      </span>
      <span class="stat" title="Badges from beating hacker trainers. Each one opens the next gate.">Badges <span class="badges" id="badges"></span></span>
    </div>
    <div class="controls">
      <button class="btn btn-small" id="btn-index" title="Threat Index (I)">📖 Index <span id="index-count"></span></button>
      <button class="btn btn-small run-btn" id="btn-sprint" aria-pressed="false" title="Sprint: hold Shift, or click to keep sprinting on. Sprinting uses stamina.">🏃 Sprint<span class="stamina" aria-hidden="true"><span id="stamina-fill"></span></span></button>
      <button class="btn btn-small" id="btn-settings" title="Settings and controls" aria-label="Settings and controls">⚙️</button>
      <button class="btn btn-small" id="btn-help" title="How to play" aria-label="How to play">?</button>
      <button class="btn btn-small" id="btn-mute" title="Sound (M)">🔊</button>
    </div>
  </header>

  <main class="world-wrap" id="world-wrap">
    <canvas id="world" aria-label="The internet. Use the arrow keys or WASD to walk, and Space to talk."></canvas>

    <!-- Talking to people and reading signs -->
    <div class="talk" id="talk" hidden aria-live="polite">
      <p class="talk-text" id="talk-text"></p>
      <span class="talk-next">▼ Space</span>
    </div>

    <!-- On-screen controls for mouse and touch -->
    <div class="pad" aria-label="Movement buttons">
      <button data-dir="up" aria-label="Walk up">▲</button>
      <button data-dir="left" aria-label="Walk left">◀</button>
      <button class="pad-a" data-dir="act" aria-label="Talk or interact">A</button>
      <button data-dir="right" aria-label="Walk right">▶</button>
      <button data-dir="down" aria-label="Walk down">▼</button>
    </div>

    <!-- Battles -->
    <section class="battle" id="battle" hidden aria-label="Battle">
      <div class="battle-field">
        <div class="fighter enemy">
          <div class="card">
            <p class="card-name"><span id="enemy-name"></span> <span class="type-tag rarity-tag" id="enemy-rarity"></span> <span class="type-tag" id="enemy-type"></span></p>
            <span class="battle-hp"><span id="enemy-hp-fill"></span></span>
          </div>
          <div class="sprite enemy-sprite" id="enemy-sprite"></div>
        </div>
        <div class="fighter player">
          <div class="sprite player-sprite" id="player-sprite"></div>
          <div class="card">
            <p class="card-name">You <span class="type-tag me">Defender</span></p>
            <span class="battle-hp"><span id="player-hp-fill"></span></span>
            <p class="hp-text" id="player-hp-text"></p>
          </div>
          <!-- Your guardian (boss battles only) -->
          <div class="guardian" id="guardian" hidden>
            <div class="sprite guardian-sprite" id="guardian-sprite"></div>
            <div class="card">
              <p class="card-name"><span id="guardian-name"></span> <span class="type-tag me" id="guardian-type"></span></p>
              <span class="battle-hp"><span id="guardian-hp-fill"></span></span>
              <p class="hp-text"><span id="guardian-team"></span> · <span id="guardian-hp-text"></span></p>
            </div>
          </div>
        </div>
      </div>
      <div class="battle-bottom">
        <div class="battle-log" id="battle-log" aria-live="polite"></div>
        <div class="battle-actions" id="battle-actions"></div>
      </div>
    </section>
  </main>

  <!-- Threat Index: everything you've met and quarantined -->
  <dialog id="dlg-index" class="panel index-panel" aria-labelledby="index-title">
    <h2 id="index-title">📖 Threat Index</h2>
    <p class="center" id="index-summary"></p>
    <div class="dex" id="dex"></div>
    <div class="dex-detail" id="dex-detail" hidden></div>
    <button class="btn close-btn" id="index-close">Close</button>
  </dialog>

  <!-- Settings: change controls and field of view (adventure.js) -->
  <dialog id="dlg-settings" class="panel settings-panel" aria-labelledby="settings-title">
    <h2 id="settings-title">⚙️ Settings</h2>
    <h3 class="settings-head">Controls</h3>
    <p class="settings-hint">Click a key, then press the new key you want. Esc cancels, Backspace clears it.</p>
    <div class="controls-table" id="controls"></div>
    <h3 class="settings-head">View</h3>
    <label class="setting-row" for="fov">
      <span>Field of view <strong id="fov-value"></strong></span>
      <input type="range" id="fov" min="70" max="150" step="5">
    </label>
    <p class="settings-hint fov-hint"><span>Zoomed in</span><span>See more of the map</span></p>
    <label class="setting-row check"><input type="checkbox" id="opt-minimap"> Show the minimap</label>
    <label class="setting-row check"><input type="checkbox" id="opt-pad"> Show the on-screen movement buttons</label>
    <div class="end-buttons">
      <button class="btn btn-primary" id="settings-close">Done</button>
      <button class="btn" id="settings-reset">Reset to default</button>
    </div>
  </dialog>

  <!-- You beat the final boss -->
  <dialog id="dlg-win" class="panel cleared-panel" aria-labelledby="win-title">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="cleared-coder" id="win-coder" aria-hidden="true"></div>
    <h2 id="win-title">You Saved the Internet!</h2>
    <p class="center" id="win-text"></p>
    <div class="end-buttons"><button class="btn btn-primary" id="win-go">Keep exploring</button></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/demo-mode.js"></script>
  <script src="js/access.js"></script>
  <script src="js/lang-es.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/content.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/adventure-data.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/adventure.js"></script>
</body>
</html>
